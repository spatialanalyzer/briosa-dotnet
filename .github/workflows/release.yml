name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without v; must equal both targets' package versions
        type: string
        required: true
      publish:
        description: Publish the validated packages and create a draft GitHub Release
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check dispatch ref, version, existing tag, and package identities
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
        run: >
          ./eng/Test-ReleaseVersion.ps1
          -Version $env:RELEASE_VERSION
          -Ref $env:GITHUB_REF
          -Commit $env:GITHUB_SHA
          -Publish:($env:RELEASE_PUBLISH -eq 'true')

  build:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      upload-release-artifacts: true

  # The draft release comes before any registry write. If GitHub refuses it (the
  # run's workflow files differ from main), nothing is published yet, and the job
  # summary gives the maintainer's recovery for this same commit.
  release:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Create or reuse the draft GitHub Release for this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: >
          ./eng/New-ReleaseDraft.ps1
          -Version $env:RELEASE_VERSION
          -Commit $env:GITHUB_SHA
          -Title "Briosa .NET $env:RELEASE_VERSION"

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: [validate, build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        sa-target: ['2024.1.0508.5', '2026.1.0529.7']
    steps:
      - name: Download validated packages from this run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: packages-${{ matrix.sa-target }}
          path: dist
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Authenticate to NuGet with GitHub OIDC
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish validated NuGet package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push dist/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
