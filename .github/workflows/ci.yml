name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      upload-release-artifacts:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build, test, and package
    strategy:
      fail-fast: false
      matrix:
        sa-target: ['2024.1.0508.5', '2026.1.0529.7']
    defaults:
      run:
        working-directory: targets/${{ matrix.sa-target }}
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Check out client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check release workflow policy
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: ./eng/Test-ReleaseWorkflowPolicy.ps1

      - name: Check release version policy
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: ./eng/Test-ReleaseVersionPolicy.ps1

      - name: Check draft release policy
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: ./eng/Test-ReleaseDraftPolicy.ps1

      - name: Read protocol lock
        id: protocol
        shell: pwsh
        run: |
          $lock = Get-Content protocol.lock.json -Raw | ConvertFrom-Json
          $conformance = Get-Content conformance.lock.json -Raw | ConvertFrom-Json
          if ($conformance.target.spatial_analyzer -ne $lock.target.spatial_analyzer) {
            throw "Conformance and protocol artifacts must target the same exact SA release."
          }
          "source_revision=$($lock.artifact.source_revision)" | Out-File $env:GITHUB_OUTPUT -Append
          "briosa_version=$($lock.artifact.briosa_version)" | Out-File $env:GITHUB_OUTPUT -Append
          "artifact_file_name=$($lock.artifact.file_name)" | Out-File $env:GITHUB_OUTPUT -Append
          "conformance_version=$($conformance.artifact.briosa_version)" | Out-File $env:GITHUB_OUTPUT -Append
          "conformance_file_name=$($conformance.artifact.file_name)" | Out-File $env:GITHUB_OUTPUT -Append
          "spatial_analyzer_target=$($lock.target.spatial_analyzer)" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Check out pinned Briosa source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: spatialanalyzer/briosa
          ref: ${{ steps.protocol.outputs.source_revision }}
          path: briosa-source

      - name: Install Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.72.0
          github_token: ${{ github.token }}

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: briosa-source/global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install the client .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: targets/${{ matrix.sa-target }}/global.json

      - name: Restore locked dependencies
        run: dotnet restore Briosa.DotNet.slnx --locked-mode

      - name: Rebuild pinned protocol artifact
        shell: pwsh
        run: >
          ../../briosa-source/targets/${{ steps.protocol.outputs.spatial_analyzer_target }}/eng/New-ProtocolArtifact.ps1
          -Version "${{ steps.protocol.outputs.briosa_version }}"
          -SourceRevision "${{ steps.protocol.outputs.source_revision }}"
          -OutputDirectory "${{ github.workspace }}/targets/${{ matrix.sa-target }}/artifacts/protocol"

      - name: Verify protocol and generated-code drift
        shell: pwsh
        run: >
          ./eng/Import-ProtocolArtifact.ps1
          -ArtifactPath "artifacts/protocol/${{ steps.protocol.outputs.artifact_file_name }}"

      - name: Download pinned client conformance artifacts
        shell: pwsh
        run: |
          # conformance.lock.json pins the server the client must reject (0.9.2);
          # released-conformance.lock.json pins the published server it must
          # still work with unchanged (0.10.0). Test-Conformance.ps1 verifies both.
          $outputDirectory = Join-Path $PWD 'artifacts/conformance'
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null
          foreach ($lockPath in @('conformance.lock.json', 'released-conformance.lock.json')) {
            $lock = Get-Content $lockPath -Raw | ConvertFrom-Json
            if ($lock.target.spatial_analyzer -ne '${{ steps.protocol.outputs.spatial_analyzer_target }}') {
              throw "$lockPath must target the same exact SA release as protocol.lock.json."
            }
            $releaseBase = "https://github.com/spatialanalyzer/briosa/releases/download/v$($lock.artifact.briosa_version)"
            $fileName = $lock.artifact.file_name
            Invoke-WebRequest "$releaseBase/$fileName" -OutFile (Join-Path $outputDirectory $fileName)
            Invoke-WebRequest "$releaseBase/$fileName.sha256" -OutFile (Join-Path $outputDirectory "$fileName.sha256")
          }

      - name: Build
        run: dotnet build Briosa.DotNet.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Briosa.DotNet.slnx -c Release --no-build --no-restore

      # Conformance diagnostics: a runner that supports it (Server 0.10.0 and
      # later) saves a failing scenario's failure message, server log digest,
      # fixture output and server log files under
      # BRIOSA_CONFORMANCE_DIAGNOSTICS_DIRECTORY, one folder per step; the last
      # step of the job uploads them when the job fails. Heap dumps on timeout
      # (BRIOSA_CONFORMANCE_DUMP_ON_TIMEOUT) stay off, because they hold process
      # memory and the upload would publish them. Briosa__Worker__StartupTimeout
      # gives the fake worker's first start 30 s on a slow runner; the runner
      # from Server 0.10.1 sets the same value itself and keeps a caller's.
      #
      # The legs that expect a rejection use the frozen Server 0.9.2 runner,
      # which has neither the diagnostics directory nor the 180 s fixture
      # timeout. They are exempt: the client rejects that installation before
      # launch, so no server or worker starts and no server log exists; the
      # fixture's stderr is in the step log.
      - name: Run shared client conformance suite
        shell: pwsh
        env:
          BRIOSA_CONFORMANCE_DIAGNOSTICS_DIRECTORY: ${{ runner.temp }}/conformance-diagnostics/legacy-server
          Briosa__Worker__StartupTimeout: '00:00:30'
        run: >
          ./eng/Test-Conformance.ps1
          -ArtifactPath "artifacts/conformance/${{ steps.protocol.outputs.conformance_file_name }}"
          -EvidencePath artifacts/legacy-conformance-evidence.json
          -ExpectIncompatible

      - name: Test the released server
        shell: pwsh
        env:
          BRIOSA_CONFORMANCE_DIAGNOSTICS_DIRECTORY: ${{ runner.temp }}/conformance-diagnostics/released-server
          Briosa__Worker__StartupTimeout: '00:00:30'
        run: |
          $lock = Get-Content released-conformance.lock.json -Raw | ConvertFrom-Json
          ./eng/Test-Conformance.ps1 `
            -ArtifactPath "artifacts/conformance/$($lock.artifact.file_name)" `
            -LockPath released-conformance.lock.json `
            -EvidencePath artifacts/released-conformance-evidence.json

      - name: Test the contract-aware server from pinned source
        shell: pwsh
        env:
          BRIOSA_CONFORMANCE_DIAGNOSTICS_DIRECTORY: ${{ runner.temp }}/conformance-diagnostics/current-server
          Briosa__Worker__StartupTimeout: '00:00:30'
        run: >
          ./eng/Test-CurrentServerConformance.ps1
          -SourceTarget "${{ github.workspace }}/briosa-source/targets/${{ matrix.sa-target }}"

      - name: Retain cross-version compatibility evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-${{ matrix.sa-target }}
          path: |
            targets/${{ matrix.sa-target }}/artifacts/legacy-conformance-evidence.json
            targets/${{ matrix.sa-target }}/artifacts/released-conformance-evidence.json
            targets/${{ matrix.sa-target }}/artifacts/current-conformance/evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify formatting
        run: dotnet format Briosa.DotNet.slnx --verify-no-changes --no-restore

      - name: Pack
        run: >
          dotnet pack src/Briosa.Client/Briosa.Client.csproj
          -c Release
          --no-build
          --no-restore
          -o artifacts/package

      - name: Verify exact-target package identity
        shell: pwsh
        run: ./eng/Test-PackageIdentity.ps1 -PackageDirectory artifacts/package

      - name: Verify packed consumer namespace
        shell: pwsh
        run: ./eng/Test-PackageConsumer.ps1

      - name: Test actual client package against the rejected, released, and current servers
        shell: pwsh
        env:
          BRIOSA_CONFORMANCE_DIAGNOSTICS_DIRECTORY: ${{ runner.temp }}/conformance-diagnostics/package
          Briosa__Worker__StartupTimeout: '00:00:30'
        run: ./eng/Test-PackageCompatibility.ps1

      - name: Retain packaged cross-version compatibility evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-compatibility-${{ matrix.sa-target }}
          path: targets/${{ matrix.sa-target }}/artifacts/*-package-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Retain conformance diagnostics of a failed job
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-diagnostics-${{ matrix.sa-target }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/conformance-diagnostics
          if-no-files-found: ignore
          retention-days: 14

      - name: Retain validated release packages
        if: inputs.upload-release-artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.sa-target }}
          path: targets/${{ matrix.sa-target }}/artifacts/package/*.nupkg
          if-no-files-found: error
          retention-days: 30
