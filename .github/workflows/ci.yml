name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build, test, and package
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Check out client
        uses: actions/checkout@v6

      - name: Read protocol lock
        id: protocol
        shell: pwsh
        run: |
          $lock = Get-Content protocol.lock.json -Raw | ConvertFrom-Json
          $conformance = Get-Content conformance.lock.json -Raw | ConvertFrom-Json
          if ($conformance.artifact.source_revision -ne $lock.artifact.source_revision -or
              $conformance.artifact.briosa_version -ne $lock.artifact.briosa_version -or
              $conformance.target.spatial_analyzer -ne $lock.target.spatial_analyzer) {
            throw "Protocol and conformance locks must identify the same Briosa product."
          }
          "source_revision=$($lock.artifact.source_revision)" | Out-File $env:GITHUB_OUTPUT -Append
          "briosa_version=$($lock.artifact.briosa_version)" | Out-File $env:GITHUB_OUTPUT -Append
          "artifact_file_name=$($lock.artifact.file_name)" | Out-File $env:GITHUB_OUTPUT -Append
          "conformance_file_name=$($conformance.artifact.file_name)" | Out-File $env:GITHUB_OUTPUT -Append
          "spatial_analyzer_target=$($lock.target.spatial_analyzer)" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Check out pinned Briosa source
        uses: actions/checkout@v6
        with:
          repository: spatialanalyzer/briosa
          ref: ${{ steps.protocol.outputs.source_revision }}
          path: briosa-source

      - name: Install Buf
        uses: bufbuild/buf-setup-action@v1.50.0
        with:
          version: 1.72.0
          github_token: ${{ github.token }}

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore Briosa.DotNet.slnx --locked-mode

      - name: Rebuild pinned protocol artifact
        shell: pwsh
        run: >
          ./briosa-source/targets/${{ steps.protocol.outputs.spatial_analyzer_target }}/eng/New-ProtocolArtifact.ps1
          -Version "${{ steps.protocol.outputs.briosa_version }}"
          -SourceRevision "${{ steps.protocol.outputs.source_revision }}"
          -OutputDirectory "${{ github.workspace }}/artifacts/protocol"

      - name: Verify protocol and generated-code drift
        shell: pwsh
        run: >
          ./eng/Import-ProtocolArtifact.ps1
          -ArtifactPath "artifacts/protocol/${{ steps.protocol.outputs.artifact_file_name }}"

      - name: Rebuild pinned client conformance artifact
        shell: pwsh
        run: >
          ./briosa-source/targets/${{ steps.protocol.outputs.spatial_analyzer_target }}/eng/New-ClientConformancePackage.ps1
          -Version "${{ steps.protocol.outputs.briosa_version }}"
          -SourceRevision "${{ steps.protocol.outputs.source_revision }}"
          -OutputDirectory "${{ github.workspace }}/artifacts/conformance"

      - name: Build
        run: dotnet build Briosa.DotNet.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Briosa.DotNet.slnx -c Release --no-build --no-restore

      - name: Run shared client conformance suite
        shell: pwsh
        run: >
          ./eng/Test-Conformance.ps1
          -ArtifactPath "artifacts/conformance/${{ steps.protocol.outputs.conformance_file_name }}"

      - name: Verify formatting
        run: dotnet format Briosa.DotNet.slnx --verify-no-changes --no-restore

      - name: Pack
        run: >
          dotnet pack src/Briosa.Client/Briosa.Client.csproj
          -c Release
          --no-build
          --no-restore
          -o artifacts/package
